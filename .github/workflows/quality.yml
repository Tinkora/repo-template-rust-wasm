name: Quality

'on':
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    uses: Tinkora/.github/.github/workflows/reusable-rust-quality.yml@e967aed0860957b24daf57e66766713c60b5bcae # Tinkora organization baseline
    with:
      working-directory: .
      toolchain: stable
      locked: true
      msrv: 1.85.0

  wasm:
    uses: Tinkora/.github/.github/workflows/reusable-wasm-quality.yml@e967aed0860957b24daf57e66766713c60b5bcae # Tinkora organization baseline
    with:
      working-directory: crates/template_web
      toolchain: stable
      locked: true
      playwright-smoke: true
      node-version: '24'
